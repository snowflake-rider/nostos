<text x="245" y="950" font-size="21" font-weight="650" fill="#223A4D">• 각 버튼: 한쪽 단자 = GPIO, 다른 쪽 단자 = GND</text>
<text x="245" y="980" font-size="21" font-weight="650" fill="#223A4D">• 현재 PINS.md 기준 Button 4 메시지 동작은 미구현(MSG_NONE)</text>
<text x="1495" y="1022" text-anchor="end" font-size="17" font-weight="600" fill="#7A8C9A">NOSTOS · 배선 전 전원 OFF · 모든 신호 3.3 V 로직</text>
